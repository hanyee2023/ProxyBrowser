name: Build APK

# 推送到 main 后自动编译 debug APK，产物在 Actions → 本次运行 → Artifacts。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # xray-core 版本：选有 android-arm64-v8a 产物的稳定版
  XRAY_VERSION: v26.10.10
  XRAY_SHA256: cbd594a6dfd4bef98283788e10fb2c299cb3c8af61b5b3ffdb1be4e96da955ef

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 把官方 xray-core 二进制作为 native lib 打进 APK。
      # Android 10+ 只允许从 nativeLibraryDir 执行 ELF，系统安装时会自动把 .so 提取到该目录。
      # 文件名必须是 lib*.so，否则 AGP 不会把它当 native lib 处理。
      - name: Bundle xray-core binary (arm64-v8a)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          echo "downloading $URL"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 -o /tmp/xray.zip "$URL"
          echo "${XRAY_SHA256}  /tmp/xray.zip" | sha256sum -c -
          unzip -o /tmp/xray.zip -d /tmp/xray-extract/
          ls -la /tmp/xray-extract/
          cp /tmp/xray-extract/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          file app/src/main/jniLibs/arm64-v8a/libxray.so
          /tmp/xray-extract/xray version || true
          test -s app/src/main/jniLibs/arm64-v8a/libxray.so
          rm -rf /tmp/xray.zip /tmp/xray-extract

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.7/bin/gradle clean assembleDebug --no-daemon --stacktrace

      # 关键校验：xray 二进制必须以「可执行」权限位进 APK。
      # AGP 打包 .so 时默认写 644，Android 解压后没有 x 位，导致
      # ProcessBuilder 报 Permission denied —— 表现为「代理开启失败」。
      # 这里先检查，再直接把 zip 内条目权限改成 0755。
      - name: Verify & fix libxray.so exec bit inside APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK = $APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libxray.so' || { echo "::error::APK 里没有 libxray.so"; exit 1; }
          SIZE=$(unzip -l "$APK" | awk '/lib\/arm64-v8a\/libxray.so/{print $1}')
          echo "libxray.so size = $SIZE"
          if [ "$SIZE" -lt 1000000 ]; then echo "::error::libxray.so 体积异常（可能是占位文件）"; exit 1; fi

          python3 - "$APK" <<'PY'
          import sys, zipfile, shutil, os
          apk = sys.argv[1]
          target = 'lib/arm64-v8a/libxray.so'
          with zipfile.ZipFile(apk) as z:
              info = z.getinfo(target)
              print('before: external_attr=0x%08x' % info.external_attr)
              already = (info.external_attr >> 16) & 0o777
          if already & 0o111:
              print('exec bit already present:', oct(already))
              sys.exit(0)

          tmp = apk + '.tmp'
          with zipfile.ZipFile(apk) as zin, zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  if item.filename == target:
                      # 0755 + regular file
                      item.external_attr = (0o100755 & 0xFFFF) << 16
                      item.create_system = 3
                  zout.writestr(item, data)
          shutil.move(tmp, apk)
          with zipfile.ZipFile(apk) as z:
              info = z.getinfo(target)
              fixed = (info.external_attr >> 16) & 0o777
          print('after: %s' % oct(fixed))
          assert fixed & 0o111, 'exec bit still missing'
          print('OK: libxray.so is executable inside APK')
          PY
          unzip -Z -v "$APK" lib/arm64-v8a/libxray.so | grep -i 'unix file attributes' || true

      # 重新签名：上一步改过 zip，原签名已失效
      - name: Re-sign APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=/usr/local/lib/android/sdk/build-tools/34.0.0
          [ -d "$BT" ] || BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          KS=/tmp/debug.keystore
          rm -f "$KS"
          keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          "$BT/zipalign" -f -p 4 "$APK" "${APK%.apk}-aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out "${APK%.apk}-signed.apk" "${APK%.apk}-aligned.apk"
          mv "${APK%.apk}-signed.apk" "$APK"
          rm -f "${APK%.apk}-aligned.apk"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          echo "signed OK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-browser-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
