name: Build APK

# 推送到 GitHub 后，GitHub 的云服务器会自动编译出 APK（你本机无需装 Android Studio）。
# 默认出「debug 包」：无需签名、可直接装手机验证。
# 想出可签名的 release 包，见文件底部「可选：签名 release」说明。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 把官方 xray-core 二进制作为 native lib 打进 APK。
      # Android 10+ 只能从 nativeLibraryDir 执行 ELF，系统安装时会自动把 .so 提取到该目录。
      - name: Bundle xray-core binary (arm64-v8a)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          XRAY_VERSION="v26.3.27"
          curl -L --fail -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          test -s /tmp/xray.zip
          unzip -o /tmp/xray.zip -d /tmp/xray-extract/
          cp /tmp/xray-extract/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          rm -rf /tmp/xray.zip /tmp/xray-extract
          ls -la app/src/main/jniLibs/arm64-v8a/
          test -s app/src/main/jniLibs/arm64-v8a/libxray.so

      # 直接用 Gradle 二进制编译，避免依赖 gradle wrapper 的 jar（本地未生成）
      - name: Build debug APK (无需签名)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.7/bin/gradle clean assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-browser-apk
          path: app/build/outputs/apk/debug/*.apk

